Version                       : '0.0.0'
PropertiesName                : 'Properties'
AttributesName                : '__Attributes__'
TagsName                      : '__Tags__'
SourceName                    : 'Source'

StringifiedPropertyName       : 'S__'
DuplicatedAttributeName       : '__DuplicatedIndex__'
UnnamedTableName              : '__Unnamed__'

# ------------------------------------------------------------------------------
# Server Connection & Networking (CLI: --Host, --Port, --Requests)
# ------------------------------------------------------------------------------
ServerHost                    : 'localhost'
ServerPort                    : 6969
ServerType                    : 'POST GET'
LongPollTimeout               : 5.0      # Timeout in seconds for HTTP long-polling change streaming.

# ------------------------------------------------------------------------------
# File Formats & Code Extensions
# ------------------------------------------------------------------------------
PropertiesFileExtension       : 'yaml'   # Either 'YAML' or 'JSON'.
SourceFileExtension           : 'luau'   # Typically, 'Lua' or 'Luau'.

# ------------------------------------------------------------------------------
# CLI Arguments & Directory Overrides (CLI: --Target, --Script, --AllDescendants)
# ------------------------------------------------------------------------------
TargetDirectory               : ~        # Equivalent to `--Target` / `-p`. Absolute or relative path where Game files are stored (e.g. 'C:/Users/User/Desktop/Game'). If null (~), defaults to 'Silicon/Game'.
ScriptToSynchronize           : ~        # Equivalent to `--Script` / `-S`. Path to a specific script to process along with its ancestry. If null (~), all scripts are processed.
DefaultCommand                : 'Bidirectional' # Default synchronization mode if none is passed on CLI ('Bidirectional', 'BidirectionalFromRoblox', 'BidirectionalFromIDE', 'AllDescendants', 'Export', 'Import', 'Server').
CustomSettingsPath            : ~        # Equivalent to `--Settings` / `-s`. Path to an alternative Settings.yaml configuration file.

# ------------------------------------------------------------------------------
# Synchronization Policy & Safety Rules
# ------------------------------------------------------------------------------
CleanUpBeforeImportInIDE      : true
CleanUpBeforeImportInRS       : true

SynchronizeAllDescendants     : false    # If false, only scripts and their direct ancestry are synchronized. If true, all place descendants are synchronized. (CLI: --AllDescendants / -a).
SyncAllDescendants            : false

ConflictMode                  : 'Local-authoritative' # Conflict resolution policy: 'Local-authoritative' | 'Studio-authoritative' | 'Merging'.

SynchronizationIDEDebounceTime: 10.0
SynchronizationRSDebounceTime : 0.1

# ------------------------------------------------------------------------------
# Script Splitting & Export Limits
# ------------------------------------------------------------------------------
MaximumRSScriptLength         : 199999   # Roblox Studio's scripts `.Source` property is scriptable but has a limit of 200,000 characters, thus any script exceeding said restriction will be separated into parts.
MaximumLengthRSScriptContainer: 'Folder' # In case the source of a script is too big causing it to be divided, the parent object of the different parts will be an object instantiated with this ClassName.

ExportFromIDEMaximumLength    : false    # If a file's source length is over `MaximumRSScriptLength`, it won't be exported to Roblox Studio.
ExportFromRSDuplicated        : true     # In Roblox Studio, two files can be equally named within the same folder, yet that's typically not the case in the user's OS. If true, the exported will be called `{OriginalName}-{i}` where i is the index of duplication with a padded zero (00, 01, 02, ...).
ExportFromRSDataChunkSize     : 819200   # Roblox Studio's HTTPService's POST Requests are limited to 1MB of data; this number represents 800KB (800 * 1,024) and is cautiously set in order to avoid errors. Can attempt to increase it.
ExportFromRSPropertyBlacklist :          # By default, `Name`, `Parent` and `Disabled` properties of instances within Roblox Studio won't be exported to avoid redundancy and as an attempt to keep bytesizes as small as possible.
  - 'Name'
  - 'Parent'
  - 'Disabled'                           # There's already `Enabled`.
ExportFromRSNameBlacklist     : [ ]      # Names of instances within Roblox Studio to strictly exclude from export.

# ------------------------------------------------------------------------------
# Internal Roblox Hierarchy & Folder Isolation
# ------------------------------------------------------------------------------
RootFolderName                : 'Silicon'
PluginFolderName              : 'Plugin'
RecycleBinFolderName          : 'Recycle Bin'
IgnoredAncestors              : [ ]

# ------------------------------------------------------------------------------
# HTTP Headers & Internal Sentinels
# ------------------------------------------------------------------------------
StatusHeader                  :
  Request-Type: GETStatus

SettingsHeader                :
  Request-Type: POSTGETSettings
DataHeader                    :
  Request-Type: POSTGETData 

LIVEHeader                    :
  Request-Frequency: LIVE
